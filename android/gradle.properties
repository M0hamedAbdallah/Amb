# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
# Kotlin compile runs in-process in the gradle daemon JVM (not a separate kotlin
# daemon) — the separate Kotlin daemon was crashing mid-KotlinCompile during the
# @rnmapbox/maps's many Kotlin compiler-warning-emitting files, surfacing as
# "Gradle build daemon disappeared unexpectedly (it may have been killed or
# may have crashed)" with no stack. in-process also lets the larger heap above
# serve the Kotlin compile too.
kotlin.compiler.execution.strategy=in-process

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# Limit parallelism during the heavy Mapbox-SDK / native build to avoid
# OS-level OOM crashes that were killing the gradle daemon mid-CMake.
org.gradle.parallel=false
org.gradle.workers.max=1

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Enable AAPT2 PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
# When unset (commented out), Gradle builds for every ABI the NDK supports
# (arm64-v8a, armeabi-v7a, x86, x86_64) producing a multi-arch APK suitable
# for release. During the local Mapbox-migration live-test we restricted
# builds to x86_64 only to match the emulator-5554 sdk_gphone16k_x86_64 ABI;
# that cut the new-arch CMake build 4x and reduced daemon OOM crashes.
# IMPORTANT: comment this back in for personal debug builds only, leave
# commented out for any release build (production APK must ship arm64-v8a).
# reactNativeArchitectures=x86_64

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want to
# write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Enable GIF support in React Native images (~200 B increase)
expo.gif.enabled=true
# Enable webp support in React Native images (~85 KB increase)
expo.webp.enabled=true
# Enable animated webp support (~3.4 MB increase)
# Disabled by default because iOS doesn't support animated webp
expo.webp.animated=false

# Enable network inspector
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Use legacy packaging to compress native libraries in the resulting APK.
expo.useLegacyPackaging=false

# Whether the app is configured to use edge-to-edge via the app config or `react-native-edge-to-edge` plugin
expo.edgeToEdgeEnabled=true

# --- @rnmapbox/maps (Mapbox GL Native SDK v11) ---
# These two properties are normally written by the @rnmapbox/maps Expo config
# plugin via withAndroidPropertiesImpl2. Since this project's android/ folder is
# hand-maintained (npx expo prebuild is not run), we set them directly here so
# the @rnmapbox/maps native module (node_modules/@rnmapbox/maps/android/build.gradle)
# picks Mapbox SDK v11.x (the v10.3.5 JS package requires the v11 native binary —
# see build.gradle line 73's `if (majorMapboxVersion < 11) throw`).
expoRNMapboxMapsVersion=11.23.1
expoRNMapboxMapsUseV11=true